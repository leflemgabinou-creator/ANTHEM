name: Build ANTHEM VST3

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vst3:
    runs-on: windows-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Configurer CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Compiler le VST3
        run: cmake --build build --config Release --target ANTHEM_VST3

      - name: Publier le VST3 en artefact
        uses: actions/upload-artifact@v7
        with:
          name: ANTHEM-Windows-VST3
          path: build/ANTHEM_artefacts/Release/VST3/ANTHEM.vst3
          if-no-files-found: error
          retention-days: 14
